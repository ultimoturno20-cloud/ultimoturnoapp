name: Database backup

on:
  schedule:
    # 05:00 Argentina (UTC-3), before the daily price updates.
    - cron: "0 8 * * *"
  workflow_dispatch:

concurrency:
  group: database-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Check secrets
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "Faltan los secretos SUPABASE_DB_URL o BACKUP_PASSPHRASE." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Dump
        run: |
          docker run --rm -e DATABASE_URL -v "$PWD:/out" postgres:17 \
            sh -c 'pg_dump --format=custom --no-owner --no-privileges --dbname="$DATABASE_URL" --file=/out/ultimoturno.dump'
          docker run --rm -v "$PWD:/out" postgres:17 pg_restore --list /out/ultimoturno.dump > toc.txt
          tables=$(grep -c " TABLE DATA " toc.txt || true)
          size=$(du -h ultimoturno.dump | cut -f1)
          echo "### Backup $(date -u +%F)" >> "$GITHUB_STEP_SUMMARY"
          echo "tablas con datos: $tables, tamano: $size" >> "$GITHUB_STEP_SUMMARY"
          test "$tables" -gt 20

      # The repository is public, so the artifact is encrypted before upload.
      - name: Encrypt
        run: |
          gpg --batch --yes --pinentry-mode loopback --symmetric --cipher-algo AES256 \
            --passphrase "$BACKUP_PASSPHRASE" --output "ultimoturno-$(date -u +%F).dump.gpg" ultimoturno.dump
          rm ultimoturno.dump

      - uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: ultimoturno-*.dump.gpg
          retention-days: 14
          if-no-files-found: error
