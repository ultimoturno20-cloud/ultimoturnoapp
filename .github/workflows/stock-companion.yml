name: Stock companion
on:
  pull_request:
    paths:
      - 'tools/stock-companion/**'
      - 'scripts/start-stock-companion.cmd'
      - '.github/workflows/stock-companion.yml'
  push:
    branches: [main]
    paths:
      - 'tools/stock-companion/**'
      - '.github/workflows/stock-companion.yml'
jobs:
  companion:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: node --test tools/stock-companion/*.test.mjs
      - run: npm ci
        working-directory: tools/stock-companion/desktop
      - run: npm test
        working-directory: tools/stock-companion/desktop
      - run: npm run build
        working-directory: tools/stock-companion/desktop
      - uses: actions/upload-artifact@v4
        with:
          name: UltimoTurno-Stock-Windows-x64
          path: .work/stock-desktop-release/UltimoTurno-Stock-*.exe
          if-no-files-found: error
