name: CoolStuff prices

on:
  schedule:
    # 04:00 Argentina (UTC-3)
    - cron: "0 7 * * *"
  workflow_dispatch:

jobs:
  update-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Update CoolStuff prices
        env:
          ULTIMOTURNO_ACCESS_KEY: ${{ secrets.ULTIMOTURNO_ACCESS_KEY }}
        run: npm run coolstuff:prices:until-done -- --api=https://ultimoturnoapp-api.vercel.app/api
