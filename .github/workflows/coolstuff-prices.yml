name: CoolStuff prices

on:
  schedule:
    # 04:00 Argentina (UTC-3)
    - cron: "0 7 * * *"
  workflow_dispatch:

jobs:
  update-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    concurrency:
      group: coolstuff-prices
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Update CoolStuff prices
        env:
          ULTIMOTURNO_ACCESS_KEY: ${{ secrets.ULTIMOTURNO_ACCESS_KEY }}
          COOLSTUFF_MAX_RUNTIME_MS: "16200000"
        run: npm run coolstuff:prices:until-done -- --api=https://ultimoturnoapp-api.vercel.app/api

      - name: Alert on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BODY="Fallo el cron de CoolStuff prices. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          ISSUE=$(gh issue list --repo ${{ github.repository }} --search 'CoolStuff prices: falló el cron in:title' --state open --json number --jq '.[0].number')
          if [ -n "$ISSUE" ]; then
            gh issue comment "$ISSUE" --repo ${{ github.repository }} --body "$BODY"
          else
            gh issue create --repo ${{ github.repository }} --title 'CoolStuff prices: falló el cron' --body "$BODY"
          fi
